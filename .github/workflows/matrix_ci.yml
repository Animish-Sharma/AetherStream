name: Cross-platform matrix

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: matrix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.os }} / ${{ matrix.compiler }} / ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            compiler: gcc-11
            arch: x86_64
            cc: gcc-11
            cxx: g++-11
            packages: gcc-11 g++-11
          - os: ubuntu-24.04
            compiler: gcc-13
            arch: x86_64
            cc: gcc-13
            cxx: g++-13
            packages: gcc-13 g++-13
          - os: ubuntu-22.04
            compiler: clang-15
            arch: x86_64
            cc: clang-15
            cxx: clang++-15
            packages: clang-15
          - os: ubuntu-24.04
            compiler: clang-17
            arch: x86_64
            cc: clang-17
            cxx: clang++-17
            packages: clang-17
          - os: ubuntu-24.04-arm
            compiler: gcc-13
            arch: aarch64
            cc: gcc-13
            cxx: g++-13
            packages: gcc-13 g++-13
          - os: macos-13
            compiler: apple-clang
            arch: x86_64
            cc: clang
            cxx: clang++
          - os: macos-14
            compiler: apple-clang
            arch: arm64
            cc: clang
            cxx: clang++
          - os: windows-2022
            compiler: msvc-2022
            arch: x86_64
            cc: cl
            cxx: cl
    runs-on: ${{ matrix.os }}
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      AETHER_LOW_MEMORY: "1"
      CMAKE_BUILD_PARALLEL_LEVEL: "1"
      CARGO_BUILD_JOBS: "1"
      RUSTFLAGS: "-C codegen-units=1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache-dependency-path: bindings/go/go.mod
      - uses: dtolnay/rust-toolchain@stable
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: x64
      - name: Install Ninja and selected Linux compiler
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ${{ matrix.packages }}
      - name: Install Ninja on macOS
        if: runner.os == 'macOS'
        run: brew install ninja
      - name: Install Ninja on Windows
        if: runner.os == 'Windows'
        run: choco install ninja --no-progress -y
      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DAETHER_BUILD_TESTS=ON
          -DAETHER_BUILD_PYTHON=OFF
          -DAETHER_LOW_MEMORY=ON
      - name: Build native libraries and tests
        run: cmake --build build --parallel 1
      - name: Native C and C++ tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Verify stable C ABI manifest and exports
        run: python scripts/verify_c_abi.py build
      - name: Go tests
        working-directory: bindings/go/aether
        shell: bash
        env:
          CC: ${{ runner.os == 'Windows' && 'gcc' || matrix.cc }}
        run: |
          export PATH="$GITHUB_WORKSPACE/build/Release:$GITHUB_WORKSPACE/build:$PATH"
          go test -v -race .
      - name: Rust tests
        working-directory: bindings/rust
        run: cargo test --release --locked
      - name: Python tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install -e . --no-build-isolation
          python -m pytest tests -v
      - name: Install package and headers
        run: cmake --install build --config Release --prefix install-matrix
