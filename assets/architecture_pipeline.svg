<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc"
 viewBox="0 0 1400 300" width="100%" height="auto">
<title id="title">AetherStream architecture pipeline</title><desc id="desc">AetherStream documentation graphic</desc>
<defs><filter id="shadow"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-opacity=".35"/></filter>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#37d5ff"/></marker></defs>
<rect width="100%" height="100%" rx="18" fill="#0b1020"/>
<text x="700" y="48" text-anchor="middle" fill="#e6edf7" font-family="system-ui" font-size="25" font-weight="700">AetherStream compression pipeline</text><rect x="40" y="92" width="160" height="104" rx="14" fill="#151d33" stroke="#37d5ff" stroke-width="2" filter="url(#shadow)"/><text x="120.0" y="135" text-anchor="middle" fill="#e6edf7" font-family="system-ui" font-size="17" font-weight="700">float32</text><text x="120.0" y="162" text-anchor="middle" fill="#93a4bd" font-family="system-ui" font-size="13">telemetry stream</text><path d="M205 144H227" stroke="#37d5ff" stroke-width="3" marker-end="url(#arrow)"/><rect x="234" y="92" width="160" height="104" rx="14" fill="#151d33" stroke="#a78bfa" stroke-width="2" filter="url(#shadow)"/><text x="314.0" y="135" text-anchor="middle" fill="#e6edf7" font-family="system-ui" font-size="17" font-weight="700">ADSP</text><text x="314.0" y="162" text-anchor="middle" fill="#93a4bd" font-family="system-ui" font-size="13">mode selector</text><path d="M399 144H421" stroke="#37d5ff" stroke-width="3" marker-end="url(#arrow)"/><rect x="428" y="92" width="160" height="104" rx="14" fill="#151d33" stroke="#a78bfa" stroke-width="2" filter="url(#shadow)"/><text x="508.0" y="135" text-anchor="middle" fill="#e6edf7" font-family="system-ui" font-size="17" font-weight="700">closed loop</text><text x="508.0" y="162" text-anchor="middle" fill="#93a4bd" font-family="system-ui" font-size="13">predictor</text><path d="M593 144H615" stroke="#37d5ff" stroke-width="3" marker-end="url(#arrow)"/><rect x="622" y="92" width="160" height="104" rx="14" fill="#151d33" stroke="#55e6a5" stroke-width="2" filter="url(#shadow)"/><text x="702.0" y="135" text-anchor="middle" fill="#e6edf7" font-family="system-ui" font-size="17" font-weight="700">online GED</text><text x="702.0" y="162" text-anchor="middle" fill="#93a4bd" font-family="system-ui" font-size="13">estimator</text><path d="M787 144H809" stroke="#37d5ff" stroke-width="3" marker-end="url(#arrow)"/><rect x="816" y="92" width="160" height="104" rx="14" fill="#151d33" stroke="#55e6a5" stroke-width="2" filter="url(#shadow)"/><text x="896.0" y="135" text-anchor="middle" fill="#e6edf7" font-family="system-ui" font-size="17" font-weight="700">SIMD cubic</text><text x="896.0" y="162" text-anchor="middle" fill="#93a4bd" font-family="system-ui" font-size="13">ECLM quantizer</text><path d="M981 144H1003" stroke="#37d5ff" stroke-width="3" marker-end="url(#arrow)"/><rect x="1010" y="92" width="160" height="104" rx="14" fill="#151d33" stroke="#55e6a5" stroke-width="2" filter="url(#shadow)"/><text x="1090.0" y="135" text-anchor="middle" fill="#e6edf7" font-family="system-ui" font-size="17" font-weight="700">16-way</text><text x="1090.0" y="162" text-anchor="middle" fill="#93a4bd" font-family="system-ui" font-size="13">interleaved rANS</text><path d="M1175 144H1197" stroke="#37d5ff" stroke-width="3" marker-end="url(#arrow)"/><rect x="1204" y="92" width="160" height="104" rx="14" fill="#151d33" stroke="#37d5ff" stroke-width="2" filter="url(#shadow)"/><text x="1284.0" y="135" text-anchor="middle" fill="#e6edf7" font-family="system-ui" font-size="17" font-weight="700">indexed bytes</text><text x="1284.0" y="162" text-anchor="middle" fill="#93a4bd" font-family="system-ui" font-size="13">CRC32-C + AIDX</text><path d="M520 222 C520 274 365 274 365 205" fill="none" stroke="#ffb454" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="442" y="264" text-anchor="middle" fill="#ffb454" font-family="system-ui" font-size="13">reconstructed-state feedback</text></svg>
